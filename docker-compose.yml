version: "3.9"

# Local development stack — docs/01-technical-architecture.md §1.4 and §6.
# Bring the whole thing up with: docker compose up --build
#
# Supabase itself is NOT included here — it's a hosted service (or `supabase start` via the
# Supabase CLI if you want it local too). Create a free project at supabase.com, then fill
# in frontend/.env and backend/.env from the .env.example files before starting.

services:
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - ./frontend/.env
    depends_on:
      - api

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    env_file:
      - ./backend/.env
    environment:
      - MONGODB_URI=mongodb://mongo:27017/itap
      - REDIS_URL=redis://redis:6379
      - AI_SERVICE_URL=http://ai-service:8000
      - CLIENT_ORIGIN=http://localhost:5173
    depends_on:
      - mongo
      - redis
      - ai-service

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    command: npm run worker
    volumes:
      - ./backend:/app
      - /app/node_modules
    env_file:
      - ./backend/.env
    environment:
      - MONGODB_URI=mongodb://mongo:27017/itap
      - REDIS_URL=redis://redis:6379
      - AI_SERVICE_URL=http://ai-service:8000
    depends_on:
      - mongo
      - redis
      - ai-service
    profiles:
      - production-like # `docker compose --profile production-like up` to run the worker
                          # as its own container; the `api` service also runs an in-process
                          # worker by default in dev (see backend/src/queues/startInProcessWorker.js)

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    volumes:
      - ./ai-service:/app
    env_file:
      - ./ai-service/.env
    environment:
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      - qdrant

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  mongo-data:
  redis-data:
  qdrant-data:
