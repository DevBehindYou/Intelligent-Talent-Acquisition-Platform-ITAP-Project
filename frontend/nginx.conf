# nginx site config for the ITAP SPA (loaded as /etc/nginx/conf.d/itap.conf).
# Serves the static Vite bundle and reverse-proxies the API + Socket.IO so the browser
# talks to a single origin (keeps the httpOnly session cookie first-party, avoids CORS).

upstream itap_api {
    # `api` is the API service name on the compose/orchestrator network.
    server api:4000;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Reasonable upload ceiling for bulk resume posts (tune to match multer limits).
    client_max_body_size 25m;

    # --- Compression -------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # --- Baseline security headers -----------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "0" always;

    # --- API reverse proxy -------------------------------------------------------------
    location /api/ {
        proxy_pass http://itap_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # --- Socket.IO (WebSocket upgrade) -------------------------------------------------
    location /socket.io/ {
        proxy_pass http://itap_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # --- Hashed static assets: cache hard (filenames change on every build) -------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- SPA fallback: every other route serves index.html (never cached) --------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
